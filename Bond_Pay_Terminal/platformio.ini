; ══════════════════════════════════════════════════════════════════════
; PlatformIO Project Configuration for OffPay Terminal
; ══════════════════════════════════════════════════════════════════════
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
data_dir = data
default_envs = nodemcuv2

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    miguelbalboa/MFRC522 @ ^1.4.10
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ── ESP8266 NodeMCU v2 Environment (Default USB Upload) ────────────────
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    -D MQTT_MAX_PACKET_SIZE=1024

; ── ESP8266 Wemos D1 Mini Environment ──────────────────────────────────
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    -D MQTT_MAX_PACKET_SIZE=1024

; ── ESP32 Dev Module Environment ───────────────────────────────────────
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags = 
    -D MQTT_MAX_PACKET_SIZE=1024

; ── Wireless OTA Upload Environment (ESP8266) ──────────────────────────
; Usage: pio run -t upload -e nodemcu_ota --upload-port 192.168.1.xxx
[env:nodemcu_ota]
platform = espressif8266
board = nodemcuv2
framework = ${common.framework}
board_build.filesystem = littlefs
upload_protocol = espota
upload_port = 192.168.1.100       ; Replace with your device IP
upload_flags =
    --port=8266
    --auth=offpay123
lib_deps = ${common.lib_deps}
build_flags = 
    -D MQTT_MAX_PACKET_SIZE=1024

; ── Wireless OTA Upload Environment (ESP32) ────────────────────────────
; Usage: pio run -t upload -e esp32_ota --upload-port 192.168.1.xxx
[env:esp32_ota]
platform = espressif32
board = esp32dev
framework = ${common.framework}
board_build.filesystem = littlefs
upload_protocol = espota
upload_port = 192.168.1.100       ; Replace with your device IP
upload_flags =
    --port=3232
    --auth=offpay123
lib_deps = ${common.lib_deps}
build_flags = 
    -D MQTT_MAX_PACKET_SIZE=1024
